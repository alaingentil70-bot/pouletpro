const rwf=n=>(n<0?"−":"")+Math.round(Math.abs(n)).toLocaleString("en-US")+" RWF";
const k=n=>Math.round(n).toLocaleString("en-US");
const pct=(n,d=1)=>(n*100).toFixed(d)+"%";
function parse(s){if(!s||typeof s!=="string")return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function iso(ms){const d=new Date(ms);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fd(ms,wd){if(ms==null)return"—";const d=new Date(ms);return (wd?WD[d.getUTCDay()]+" ":"")+d.getUTCDate()+" "+MON[d.getUTCMonth()]}
function todayMs(){const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())}

function photosFor(kind,key){return S.photos.filter(p=>p.kind===kind&&(kind==="day"?num(p.day)===key:kind==="med"?p.medId===key:kind==="material"?p.materialId===key:true)).sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")))}

function addBtn(kind,key,label){return canWrite&&assets?`<button type="button" class="addph" data-upload="${kind}" data-key="${esc(key??"")}">${label||"+ Add photo"}</button>`:""}
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));if(sc===1&&file.size<1.5e6)return file;
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.86))}catch(e){return file}
}

          const n=fms!=null?Math.floor((fms-M.start)/DAY)+1:null;day=n>=1&&n<=M.cycleDays?n:Math.min(Math.max(M.dayNow||1,1),M.cycleDays);placed.push(day)}
        doc.day=day;doc.date=iso(M.start+(day-1)*DAY)}

      if(target.kind==="med"){doc.medId=target.medId;const m=S.meds.find(x=>x._id===target.medId);doc.medName=m?m.name:""}
      await db.collection("photos").add(doc);ok++;
    }catch(e){const c=e&&e.code;toast(c==="unsupported_type"?"That photo format is not supported. Use JPG or PNG (on iPhone: Settings, Camera, Formats, Most Compatible).":c==="too_large"?"That photo is too large (20 MB limit).":c==="quota_exceeded"?"Photo storage is full. Delete some photos first.":"A photo could not be uploaded. Try again.");}

/* ---------- derived numbers ---------- */
function derive(){
  const st=S.setup||{};
  const start=parse(st.startDate);
  const cycleDays=num(st.cycleDays)||45;
  const today=todayMs();
  const dayNow=start!=null?Math.floor((today-start)/DAY)+1:null;
  const saleMs=start!=null?start+(cycleDays-1)*DAY:null;
  const chicks=num(st.chicks), bonus=num(st.bonusChicks), flock=chicks+bonus;
  const days=[];let alive=flock,deaths=0,lastLogged=0;
  for(let d=1;d<=cycleDays;d++){
    const r=S.daily[dayId(d)]||null;
    const dd=r?num(r.deaths):0;
    const startAlive=alive; alive-=dd; deaths+=dd;
    if(r&&(r.notes||dd))lastLogged=d;
    days.push({day:d,date:start!=null?start+(d-1)*DAY:null,rec:r,deaths:dd,startAlive,endAlive:alive});
  }
  const mortality=flock?deaths/flock:0;
  const feedKg=S.feed.reduce((a,f)=>a+num(f.bags)*num(f.kgPerBag),0);
  const feedCost=S.feed.reduce((a,f)=>a+num(f.bags)*num(f.costPerBag),0);
  const medCost=S.meds.reduce((a,m)=>a+num(m.cost),0);
  const chickCost=chicks*num(st.pricePerChick);
  const other=num(st.otherCosts), coop=num(st.coopShare);
  const expTotal=S.expenses.reduce((a,e)=>a+num(e.amount),0);
  const totalCost=chickCost+feedCost+medCost+other+coop+expTotal;
  const weight=num(st.actualWeight)||num(st.targetWeight);
  const price=num(st.salePrice);
  const soldBirds=S.sales.reduce((a,s)=>a+num(s.birds),0), soldKg=S.sales.reduce((a,s)=>a+num(s.kg),0);
  const salesAmt=S.sales.reduce((a,s)=>a+saleAmt(s),0), salesPaid=S.sales.reduce((a,s)=>a+num(s.paid),0), owed=Math.max(0,salesAmt-salesPaid);
  const onHand=Math.max(0,alive-soldBirds);
  const revenue=salesAmt+onHand*weight*price;
  const profit=revenue-totalCost;
  const startKg=flock*0.044;
  const feedBy=ms=>S.feed.filter(f=>{const d=parse(f.date);return d==null||ms==null||d<=ms}).reduce((a,f)=>a+num(f.bags)*num(f.kgPerBag),0);
  const soldBy=ms=>S.sales.filter(x=>{const d=parse(x.date);return d!=null&&d<=ms});
  const weighins=S.weighins.map(w=>{const dms=parse(w.date);const day=start!=null&&dms!=null?Math.round((dms-start)/DAY)+1:num(w.day);const avg=num(w.birds)?num(w.totalKg)/num(w.birds):0;
    let fcr=null;if(w.feedLeftKg!=null&&w.feedLeftKg!==""&&avg){const sb=soldBy(dms);const sk=sb.reduce((a,x)=>a+num(x.kg),0),sn=sb.reduce((a,x)=>a+num(x.birds),0);
      const aliveThen=days[Math.min(Math.max(day,1),cycleDays)-1]?.endAlive??alive;const live=Math.max(0,aliveThen-sn)*avg+sk;const used=feedBy(dms)-num(w.feedLeftKg);const gain=live-startKg;fcr=gain>0&&used>0?used/gain:null}
    return {...w,day,avg,fcr}}).filter(w=>w.avg>0).sort((a,b)=>a.day-b.day);
  let fcr=null,fcrFinal=false,liveKg=null;
  if(onHand===0&&soldBirds>0){const used=feedKg-num(st.feedLeftKg);const gain=soldKg-startKg;if(gain>0)fcr=used/gain;fcrFinal=true;liveKg=soldKg}
  else{const lw=[...weighins].reverse().find(w=>w.fcr);if(lw)fcr=lw.fcr;const l=weighins[weighins.length-1];if(l)liveKg=onHand*l.avg+soldKg}
  const costPerKg=liveKg?totalCost/liveKg:null;
  const ageNow=Math.min(dayNow??cycleDays,cycleDays);
  const avgNow=soldBirds&&onHand===0?soldKg/soldBirds:(weighins.length?weighins[weighins.length-1].avg:null);
  const epef=fcr&&avgNow?((1-mortality)*100*avgNow)/(ageNow*fcr)*100:null;
  const vax=[...S.vaccines].sort((a,b)=>num(a.day)-num(b.day));
  const medByName={};S.meds.forEach(m=>{medByName[(m.name||"").trim().toLowerCase()]=m});
  const doses=S.doses.map(d=>{
    const m=medByName[(d.product||"").trim().toLowerCase()]||null;
    const s=parse(d.start), e=parse(d.end);
    const wd=m?num(m.withdrawal):null;
    const daysGiven=s!=null&&e!=null?Math.round((e-s)/DAY)+1:null;
    const safe=e!=null&&wd>0?e+wd*DAY:null;
    return {...d,med:m,s,e,wd,daysGiven,total:daysGiven!=null?daysGiven*num(d.timesPerDay||1):null,safe,anti:m&&/antibiotic/i.test(m.type||"")};
  }).sort((a,b)=>(a.s??0)-(b.s??0));
  let latestSafe=null;doses.forEach(d=>{if(d.safe!=null&&(latestSafe==null||d.safe>latestSafe))latestSafe=d.safe});
  const ongoing=doses.filter(d=>d.s!=null&&d.e==null&&d.anti);
  const matCost=m=>num(m.qty||1)*num(m.unitCost);
  const matSpent=S.materials.reduce((a,m)=>a+matCost(m),0);
  const matCycle=S.materials.reduce((a,m)=>a+(m.kind==="Reusable"?matCost(m)/Math.max(1,num(m.cycles)||1):matCost(m)),0);
  const shopping=S.materials.filter(m=>m.status==="Need to buy"||m.status==="Running low"||m.status==="Broken or worn out");
  const activeToday=doses.filter(d=>d.s!=null&&d.s<=today&&(d.e==null||d.e>=today));
  return {expTotal,soldBirds,soldKg,salesAmt,salesPaid,owed,onHand,weighins,fcr,fcrFinal,costPerKg,epef,vax,matSpent,matCycle,shopping,matCost,st,start,cycleDays,today,dayNow,saleMs,chicks,bonus,flock,days,alive,deaths,mortality,lastLogged,feedKg,feedCost,medCost,chickCost,other,coop,totalCost,weight,price,revenue,profit,doses,latestSafe,ongoing,activeToday,medByName};
}
function mortStatus(m){if(m<=0.02)return["good","On the 2% goal"];if(m<=0.05)return["neutral","Normal range (1–5%)"];if(m<=0.10)return["warn","Beginner range (5–10%)"];return["crit","Above 10%"]}

function alerts(M){
  const out=[];
  if(!S.setup){out.push(["info","No setup yet","Open Setup and enter the start date and chick numbers."]);return out}
  if(M.latestSafe!=null&&M.saleMs!=null&&M.latestSafe>M.saleMs) out.push(["crit","Medicine withdrawal runs past the sale date",`The last medicine is not cleared until ${fd(M.latestSafe,1)}, after the planned sale on ${fd(M.saleMs,1)}. Delay the sale or stop the course earlier.`]);
  M.ongoing.forEach(d=>out.push(["warn",`${d.product} has no last day entered`,`Add the last day in the Dosing log so the safe-to-sell date can be worked out.`]));
  // interactions
  const seen=new Set(), pairs={};
  for(let i=0;i<M.doses.length;i++)for(let j=0;j<M.doses.length;j++){
    if(i===j)continue;const a=M.doses[i],b=M.doses[j];
    if(a.s==null||b.s==null)continue;
    const ae=a.e??M.today, be=b.e??M.today;
    if(a.s>be||b.s>ae)continue;
    const os=Math.max(a.s,b.s), oe=Math.min(ae,be);
    const avoid=String(a.med?.avoidWith||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
    const bn=(b.product||"").trim().toLowerCase();
    if(avoid.includes(bn)){
      const key=a.product+"|"+b.product;
      if(!pairs[key])pairs[key]={a:a.product,b:b.product,r:[]};
      const rr=fd(os)+" to "+fd(oe);if(!pairs[key].r.includes(rr))pairs[key].r.push(rr);
    }
    if(i<j&&a.anti&&b.anti&&a.product!==b.product){
      const key="aa|"+os;
      if(!seen.has(key)){seen.add(key);out.push(["warn","Two antibiotics overlapped",`${a.product} and ${b.product} were both given ${fd(os)} to ${fd(oe)}. Ask a vet before combining antibiotics again.`])}
    }
  }
  Object.values(pairs).forEach(p=>out.push(["warn",`${p.a} was given together with ${p.b}`,`${p.r.join("; ")}. The label says ${p.b} can stop ${p.a} from working. Pause it during the next course.`]));
  const [ms]=mortStatus(M.mortality);
  if(ms==="warn"||ms==="crit") out.push([ms,`Death rate is ${pct(M.mortality)}`,`${M.deaths} of ${M.flock} birds lost. Each bird is worth about ${rwf(M.weight*M.price)} at sale.`]);
  if(M.dayNow!=null&&M.dayNow>=1&&M.dayNow<=M.cycleDays){
    const missing=[];for(let d=1;d<=Math.min(M.dayNow,M.cycleDays);d++){if(!S.daily[dayId(d)]?.notes)missing.push(d)}
    if(missing.length) out.push(["info",missing.length===1?`Day ${missing[0]} has no notes yet`:`${missing.length} days have no notes`,missing.length<=6?`Days ${missing.join(", ")}. Write one or two lines, good days too.`:`Earliest: day ${missing[0]}. Write one or two lines, good days too.`]);
    const c=S.checks[iso(M.today)]?.items||{};const done=CHECK_ITEMS.filter(x=>c[x[0]]).length;
    if(done<CHECK_ITEMS.length) out.push(["info",`Today's checklist: ${done} of ${CHECK_ITEMS.length} done`,"Open Checklist & to-dos to tick them off."]);
    const left=M.cycleDays-M.dayNow;
    if(left<=7&&left>=0) out.push(["info",`${left} day${left===1?"":"s"} to the planned sale`,"Line up buyers, state your price first, and do not sell swollen or sick birds."]);
  }
  M.vax.filter(v=>(v.status||"Planned")==="Planned"&&M.dayNow!=null&&num(v.day)<=M.dayNow+1).forEach(v=>{const d=num(v.day);out.push([d<M.dayNow?"warn":"info",d<M.dayNow?`Vaccination overdue: ${v.disease}`:d===M.dayNow?`Vaccinate today: ${v.disease}`:`Vaccinate tomorrow: ${v.disease}`,`${v.vaccine||""} · ${v.route||""} · planned for day ${d}. Mark it given in Health & medicine.`])});
  if(M.owed>0)out.push(["warn",`${rwf(M.owed)} still owed by buyers`,"See Sales & buyers."]);
  if(M.dayNow!=null&&M.dayNow>=7&&M.dayNow<=M.cycleDays&&M.onHand>0){const lw=M.weighins[M.weighins.length-1];if(!lw||M.dayNow-lw.day>=7)out.push(["info",lw?`Last weigh-in was ${M.dayNow-lw.day} days ago`:"No weigh-in yet","Weigh 5–10 birds and note the feed left in store. See Growth & FCR."])}
  if(M.shopping.length)out.push(["info",`Shopping list: ${M.shopping.length} item${M.shopping.length===1?"":"s"}`,M.shopping.map(m=>m.name).join(", ")+". See Materials."]);
  S.todos.filter(t=>!t.done&&parse(t.date)!=null&&parse(t.date)<M.today).forEach(t=>out.push(["info",`Overdue: ${t.text}`,`Was due ${fd(parse(t.date),1)}.`]));
  const big=M.days.filter(d=>d.deaths>=2);if(big.length)out.push(["warn",`More than one death on day ${big.map(d=>d.day).join(", ")}`,"Two or more deaths in a day is the point to call a vet or the RAB office."]);
  const order={crit:0,warn:1,info:2,good:3};out.sort((a,b)=>order[a[0]]-order[b[0]]);
  return out;
}

  const costs=[["Feed",M.feedCost],["Chicks",M.chickCost],["Medicine & vitamins",M.medCost],["Coop & equipment",M.coop],["Other",M.other]].sort((a,b)=>b[1]-a[1]);

  return `
  <div class="hero">

      <div class="sub">${left!=null&&left>=0?`${left} days to the planned sale on <b>${fd(M.saleMs,1)}</b>`:left!=null?`Planned sale was ${fd(M.saleMs,1)}`:""}</div></div>
    <div><div class="eyebrow">Birds alive</div><div class="mid">${M.alive} <span class="muted" style="font-size:1rem">/ ${M.flock}</span></div><div class="sub">${M.deaths} lost · <span class="chip ${ms}">${pct(M.mortality)} · ${ml}</span></div></div>
    <div><div class="eyebrow">Safe to sell after</div><div class="mid">${M.latestSafe!=null?fd(M.latestSafe):"No wait"}</div><div class="sub">${M.latestSafe!=null&&M.saleMs!=null?(M.latestSafe>M.saleMs?'<span class="chip crit">Conflicts with sale date</span>':'<span class="chip good">Clears before sale</span>'):"No medicine withdrawal logged"}</div></div>
    <div><div class="eyebrow">Projected profit</div><div class="mid">${k(M.profit)}</div><div class="sub">RWF at ${M.weight} kg × ${k(M.price)} RWF/kg</div></div>
  </div>
  <div class="grid2">
    <section class="panel"><h3>Needs attention <span class="chip neutral">${al.length}</span></h3>
      ${al.length?`<div class="alerts">${al.map(([s,t,p])=>`<div class="alert"><span class="chip ${s}">${{crit:"Critical",warn:"Check",info:"To do",good:"Good"}[s]}</span><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join("")}</div>`:`<p class="muted">Nothing needs attention.</p>`}
    </section>
    <section class="panel"><h3>Birds alive by day<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:.8rem">dashed lines are death-rate marks</span></h3>${flockChart(M)}</section>
  </div>
  <div class="grid3">

      <div class="hbar">${costs.map(([l,v])=>`<span>${l}</span><span class="tr"><i style="width:${(v/maxC*100).toFixed(1)}%"></i></span><span class="v">${k(v)}</span>`).join("")}</div>
      <div class="kv" style="margin-top:12px"><div class="em">Total cost</div><div class="em">${rwf(M.totalCost)}</div><div>Feed share of cost</div><div>${M.totalCost?pct(M.feedCost/M.totalCost,0):"—"}</div></div>
    </section>
    <section class="panel"><h3>Given today</h3>
      ${M.activeToday.length?M.activeToday.map(d=>`<div class="alert"><span class="badge-type"><i style="background:var(${d.anti?"--anti":"--supp"})"></i>${d.anti?"Antibiotic":"Supplement"}</span><b>${esc(d.product)}</b><p>${d.e!=null?"Until "+fd(d.e,1):"No last day set"}${d.wd?` · ${d.wd}-day wait before sale`:""}</p></div>`).join(""):`<p class="muted">Nothing is logged as given today.</p>`}
    </section>
    <section class="panel"><h3>Latest notes<span class="spacer"></span><button class="btn sm" data-go="daily" type="button">Daily log</button></h3>
      ${recent.length?recent.map(d=>`<div class="alert"><span class="mono muted">Day ${d.day}</span><b>${fd(d.date,1)}${d.deaths?` · <span class="dz">${d.deaths} died</span>`:""}</b><p>${esc(d.rec.notes)}</p></div>`).join(""):`<p class="muted">No notes yet.</p>`}
    </section>
  </div>`;

function flockChart(M){
  const W=640,H=250,L=44,R=62,T=14,B=30;
  const lo=Math.floor(M.flock*0.86),hi=M.flock;
  const x=d=>L+(d-1)/(M.cycleDays-1)*(W-L-R);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const cut=Math.min(M.dayNow??0,M.cycleDays);
  let path="",proj="";
  M.days.forEach(d=>{if(d.day<=cut){path+=(path?"L":"M")+x(d.day).toFixed(1)+","+y(d.startAlive).toFixed(1)+"H"+(x(Math.min(d.day+1,M.cycleDays))).toFixed(1)+"V"+y(d.endAlive).toFixed(1)}});
  if(cut>=1&&cut<M.cycleDays){const v=M.days[cut-1].endAlive;proj=`M${x(cut+1).toFixed(1)},${y(v).toFixed(1)}H${x(M.cycleDays).toFixed(1)}`}
  const refs=[[0.02,"2% goal"],[0.05,"5%"],[0.10,"10%"]].map(([p,l])=>{const v=M.flock*(1-p);return `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${W-R+6}" y="${y(v)+4}">${l}</text>`}).join("");
  let yt="";for(let v=hi;v>=lo;v-=Math.max(1,Math.round((hi-lo)/4))){yt+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  let xt="";[1,8,15,22,29,36,M.cycleDays].forEach(d=>{xt+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle">${d}</text>`});
  const dots=M.days.filter(d=>d.deaths&&d.day<=cut).map(d=>`<circle class="dot" cx="${x(d.day)}" cy="${y(d.endAlive)}" r="4.5"/>`).join("");
  const today=M.dayNow>=1&&M.dayNow<=M.cycleDays?`<line class="todayln" x1="${x(M.dayNow)}" x2="${x(M.dayNow)}" y1="${T}" y2="${H-B}"/>`:"";
  const step=(W-L-R)/(M.cycleDays-1);
  const hits=M.days.map(d=>`<rect class="hit" x="${x(d.day)-step/2}" y="${T}" width="${step}" height="${H-T-B}" data-tip="${esc(`<b>Day ${d.day}</b> · ${fd(d.date,1)}<br>`+(d.day<=cut?`${d.endAlive} alive${d.deaths?` · <b>${d.deaths} died</b>`:""}${d.rec?.notes?`<br>${esc(d.rec.notes.slice(0,140))}${d.rec.notes.length>140?"…":""}`:""}`:"Not reached yet"))}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Birds alive by day of the cycle">${yt}${refs}<path class="proj" d="${proj}"/><path class="series" d="${path}"/>${today}${dots}${xt}<text x="${L}" y="${H-0}" class="lab" style="font-size:10px">day of cycle</text>${hits}</svg>
  <div class="legend"><span><i style="background:var(--ink);height:2px"></i>Birds alive</span><span><i style="background:var(--crit);border-radius:50%;width:9px;height:9px"></i>A death</span><span><i style="background:var(--accent);width:2px;height:12px"></i>Today</span><span><i style="border-top:2px dashed var(--muted);height:0"></i>If no more deaths</span></div>`;
}

function weekTemp(w){return ["32–35 °C","about 30–32 °C","about 27–29 °C","about 24–26 °C","about 21–24 °C","about 21–24 °C","about 21–24 °C"][w-1]||""}
function vDaily(M){
  if(!S.setup)return emptyState();
  const td=M.dayNow>=1&&M.dayNow<=M.cycleDays?M.dayNow:null;
  const cur=td?S.daily[dayId(td)]||{}:{};
  const q=dailyFilter.q.trim().toLowerCase();
  let rows="";let wk=0;
  for(const d of M.days){
    const w=Math.ceil(d.day/7);
    if(!q&&!dailyFilter.deathsOnly&&w!==wk){wk=w;rows+=`<tr class="wkrow"><td colspan="6">WEEK ${w} · days ${(w-1)*7+1}–${Math.min(w*7,M.cycleDays)} · room heat guide ${weekTemp(w)}</td></tr>`}
    if(dailyFilter.deathsOnly&&!d.deaths)continue;
    if(q&&!(d.rec?.notes||"").toLowerCase().includes(q))continue;
    const fut=M.dayNow!=null&&d.day>M.dayNow;
    rows+=`<tr class="${canWrite?"click ":""}${fut?"future ":""}${d.day===td?"todayrow":""}" data-day="${d.day}"><td class="mono">${fd(d.date,1)}</td><td class="n">${d.day}</td><td class="n">${fut&&!d.rec?"":d.startAlive}</td><td class="n ${d.deaths?"dz":""}">${fut&&!d.rec?"":d.deaths}</td><td class="n">${fut&&!d.rec?"":d.endAlive}</td><td class="note">${(()=>{const ph=photosFor("day",d.day);return ph.length?`<div class="thumbs" style="margin-bottom:6px">${thumbs(ph.slice(0,4),1)}</div>`:""})()}${condLine(d.rec)}${esc(d.rec?.notes||"")}</td></tr>`;
  }
  const causes={};M.days.forEach(d=>{if(d.deaths){const c=d.rec?.cause||"Not recorded";causes[c]=(causes[c]||0)+d.deaths}});
  return `
  <div class="vhead"><div><h2>Daily log</h2><p>One row per day of the cycle. Birds alive carries forward from the setup automatically. ${canWrite?"Tap a row to edit it.":""}</p></div></div>
  ${td&&canWrite?`<section class="panel"><h3>Log today · day ${td} · ${fd(M.today,1)}</h3>
    <div class="fgrid"><div class="field"><label>Deaths today</label><div class="stepper"><button type="button" data-step="-1" aria-label="One fewer">−</button><output id="qDeaths">${num(cur.deaths)}</output><button type="button" data-step="1" aria-label="One more">+</button></div><span class="hint">${M.days[td-1].startAlive} birds at the start of today</span></div>
    <div class="field wide"><label for="qNotes">Notes and symptoms</label><textarea id="qNotes" placeholder="How they look and act, droppings, bedding and smell, heater and huddling, what you did, what to check tomorrow. Use numbers, for example: about 5 sneezing.">${esc(cur.notes||"")}</textarea></div>${condFields(cur,"q_")}</div>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="btn pri" type="button" data-act="saveToday">Save day ${td}</button></div></section>`:""}
  <section class="panel">
    <div class="fgrid" style="margin-bottom:12px"><div class="field"><label for="dq">Search notes</label><input type="text" id="dq" placeholder="wheezing, diarrhea, rain…" value="${esc(dailyFilter.q)}"></div>
    <label class="check" style="border:0;align-self:end"><input type="checkbox" id="donly" ${dailyFilter.deathsOnly?"checked":""}><span>Only days with deaths</span></label></div>
    <div class="tw"><table><thead><tr><th>Date</th><th class="n">Day</th><th class="n">Alive (start)</th><th class="n">Deaths</th><th class="n">Alive (end)</th><th>Notes / symptoms seen</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="muted">No days match.</td></tr>`}</tbody>
    ${Object.keys(causes).length?`<caption style="caption-side:bottom;text-align:left;padding-top:10px;font-size:.8rem;color:var(--ink2)">Deaths by cause: ${Object.entries(causes).map(([c,n])=>esc(c)+" "+n).join(" · ")}</caption>`:""}
    <tfoot><tr class="tot"><td>Totals</td><td></td><td></td><td class="n">${M.deaths}</td><td class="n">${M.alive}</td><td>${pct(M.mortality)} death rate</td></tr></tfoot></table></div>
  </section>`;
}

function gantt(M){
  const ds=M.doses.filter(d=>d.s!=null);
  if(!ds.length)return `<p class="muted">No doses logged yet.</p>`;
  let maxDay=M.cycleDays;ds.forEach(d=>{const end=(d.safe??d.e??M.today);maxDay=Math.max(maxDay,Math.round((end-M.start)/DAY)+1)});
  const LW=170,W=820,R=16,rowH=26,T=26,H=T+ds.length*rowH+30;
  const x=day=>LW+(day-1)/(maxDay)*(W-LW-R);
  const dn=ms=>(ms-M.start)/DAY+1;
  let g=`<defs><pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--anti)" stroke-width="2.4"/></pattern><pattern id="hatchS" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--supp)" stroke-width="2.4"/></pattern></defs>`;
  for(let d=1;d<=maxDay+1;d+=7){g+=`<line class="grid" x1="${x(d)}" x2="${x(d)}" y1="${T-6}" y2="${H-24}"/><text x="${x(d)}" y="${T-10}" text-anchor="middle">${d===1?"day 1":d}</text>`}
  ds.forEach((d,i)=>{
    const y=T+i*rowH+5, h=rowH-10;
    const a=dn(d.s), b=dn(d.e??M.today)+1;
    const cls=d.anti?"anti":"supp";
    const tip=`<b>${esc(d.product)}</b><br>${fd(d.s,1)} to ${d.e!=null?fd(d.e,1):"still giving"}${d.daysGiven?` · ${d.daysGiven} days`:""}${d.wd?`<br>${d.wd}-day withdrawal · safe after ${fd(d.safe,1)}`:"<br>No withdrawal"}${d.notes?`<br>${esc(d.notes)}`:""}`;
    g+=`<text class="lab" x="0" y="${y+h-2}">${esc((d.product||"").slice(0,22))}</text>`;
    g+=`<rect class="bar-${cls}" x="${x(a)}" y="${y}" width="${Math.max(3,x(b)-x(a)-1)}" height="${h}" rx="2"/>`;
    if(d.safe!=null){const c=dn(d.safe)+1;g+=`<rect class="wd-${cls}" x="${x(b)}" y="${y}" width="${Math.max(0,x(c)-x(b))}" height="${h}" rx="2" stroke="var(--${cls==="anti"?"anti":"supp"})" stroke-width="1"/>`}
    g+=`<rect class="hit" x="0" y="${y-4}" width="${W}" height="${rowH}" data-tip="${esc(tip)}"/>`;
  });
  const sx=x(M.cycleDays+0.5), tx=x((M.today-M.start)/DAY+1.5);
  g+=`<line class="saleln" x1="${sx}" x2="${sx}" y1="${T-6}" y2="${H-24}"/><text x="${sx}" y="${H-8}" text-anchor="end" style="fill:var(--accent)">sale · day ${M.cycleDays}</text>`;
  if(M.dayNow>=1&&M.dayNow<=maxDay)g+=`<line class="todayln" x1="${tx}" x2="${tx}" y1="${T-6}" y2="${H-24}" stroke-opacity=".55"/><text x="${tx}" y="${H-8}" text-anchor="middle" style="fill:var(--accent)">${Math.abs(tx-sx)<60?"":"today"}</text>`;
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:640px" role="img" aria-label="Dosing timeline with withdrawal periods">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--anti)"></i>Antibiotic given</span><span><i style="background:repeating-linear-gradient(45deg,var(--anti) 0 2px,transparent 2px 5px);border:1px solid var(--anti)"></i>Antibiotic withdrawal (no meat sale)</span><span><i style="background:var(--supp)"></i>Supplement or vitamin given</span><span><i style="border-left:2px dashed var(--accent);width:2px"></i>Planned sale</span></div>`;
}

function vHealth(M){
  if(!S.setup)return emptyState();
  const birds=M.alive;
  const calcRows=S.meds.filter(m=>num(m.rateMin)>0).map(m=>{
    let amt,how;
    if(m.basis==="per 100 birds per day"){const r=calc.stage==="chick"?num(m.rateMin):num(m.rateMax||m.rateMin);amt=r*birds/100;how=`${r} ${m.rateUnit} per 100 birds a day (${calc.stage==="chick"?"chick":"grower/broiler"} rate) · ${birds} birds`;
      return `<tr><td><b>${esc(m.name)}</b><div class="muted" style="font-size:.78rem">${esc(how)}</div></td><td class="n">${amt.toFixed(1)} ${esc(m.rateUnit)} a day</td><td class="muted">split across the day's water</td></tr>`}
    const lo=num(m.rateMin)*calc.litres, hi=num(m.rateMax||m.rateMin)*calc.litres;
    const range=lo===hi?fmtAmt(lo):`${fmtAmt(lo)}–${fmtAmt(hi)}`;
    const tsp=m.rateUnit==="g"?`about ${(lo/4).toFixed(lo/4<1?2:1)}${lo===hi?"":"–"+(hi/4).toFixed(hi/4<1?2:1)} level tsp`:`use a syringe or pipette`;
    return `<tr><td><b>${esc(m.name)}</b><div class="muted" style="font-size:.78rem">${esc(m.dosage||"")}</div></td><td class="n">${range} ${esc(m.rateUnit)}</td><td class="muted">${tsp}</td></tr>`;
  }).join("");
  const medRows=S.meds.map(m=>`<tr class="${canWrite?"click":""}" data-edit="meds" data-id="${esc(m._id)}"><td><div style="display:flex;gap:8px;align-items:center">${thumbs(photosFor("med",m._id).slice(0,1),1)}<b>${esc(m.name)}</b></div></td><td><span class="badge-type"><i style="background:var(${/antibiotic/i.test(m.type||"")?"--anti":"--supp"})"></i>${esc(m.type)}</span></td><td>${esc(m.purpose)}</td><td>${esc(m.dosage)}</td><td class="n">${num(m.withdrawal)?num(m.withdrawal)+" days":"None"}</td><td class="n">${k(num(m.cost))}</td><td class="mono">${fd(parse(m.dateBought))}</td></tr>`).join("");
  const doseRows=M.doses.map(d=>`<tr class="${canWrite?"click":""}" data-edit="doses" data-id="${esc(d._id)}"><td class="mono">${fd(d.s)}</td><td class="mono">${d.e!=null?fd(d.e):'<span class="chip warn">still giving</span>'}</td><td><b>${esc(d.product)}</b>${d.med?"":' <span class="chip crit">not in medicine list</span>'}</td><td class="n">${num(d.timesPerDay)||1}</td><td class="n">${d.daysGiven??"—"}</td><td class="n">${d.wd?d.wd+" d":"—"}</td><td class="mono">${d.safe!=null?fd(d.safe,1):d.wd===0||d.wd==null?"no wait":"—"}</td><td class="note">${esc(d.notes||"")}</td></tr>`).join("");
  return `
  <div class="vhead"><div><h2>Health & medicine</h2><p>Every course you give, its withdrawal period, and the date the birds can be sold for meat. Check every amount against the printed label on your own packet.</p></div><span class="spacer"></span>${canWrite?`<button class="btn pri" type="button" data-add="doses">Log a dose</button>`:""}</div>
  <div class="hero" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div><div class="eyebrow">Latest safe-to-sell date</div><div class="mid">${M.latestSafe!=null?fd(M.latestSafe,1):"No wait"}</div><div class="sub">across all logged doses</div></div>
    <div><div class="eyebrow">Planned sale</div><div class="mid">${fd(M.saleMs,1)}</div><div class="sub">day ${M.cycleDays} of the cycle</div></div>
    <div><div class="eyebrow">Status</div><div class="mid" style="font-size:1.1rem;margin-top:12px">${M.latestSafe!=null&&M.latestSafe>M.saleMs?'<span class="chip crit">Delay the sale</span>':'<span class="chip good">No conflict</span>'}</div><div class="sub">${M.latestSafe!=null&&M.saleMs!=null?Math.round((M.saleMs-M.latestSafe)/DAY)+" days of margin":""}</div></div>
  </div>
  ${vaxSection(M)}
  <section class="panel"><h3>Dosing timeline</h3>${gantt(M)}</section>
  <section class="panel"><h3>Dosing log<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:.8rem">stopped and started again? add a new row</span></h3>
    <div class="tw"><table><thead><tr><th>First day</th><th>Last day</th><th>Product</th><th class="n">Times/day</th><th class="n">Days</th><th class="n">Wait</th><th>Safe to sell after</th><th>Notes</th></tr></thead><tbody>${doseRows||`<tr><td colspan="8" class="muted">No doses logged.</td></tr>`}</tbody></table></div></section>
  <section class="panel"><h3>Dose calculator</h3>
    <div class="fgrid" style="margin-bottom:12px"><div class="field"><label for="cL">Water in the jug or tank (litres)</label><input type="number" id="cL" min="0.5" step="0.5" value="${calc.litres}"></div>
    <div class="field"><label for="cStage">Bird stage (for per-bird products)</label><select id="cStage"><option value="chick" ${calc.stage==="chick"?"selected":""}>Chicks</option><option value="grower" ${calc.stage==="grower"?"selected":""}>Growers and broilers</option></select></div></div>
    <div class="tw"><table><thead><tr><th>Product</th><th class="n">Amount</th><th>Measuring</th></tr></thead><tbody>${calcRows||`<tr><td colspan="3" class="muted">Add a label rate to a product in the medicine list to use the calculator.</td></tr>`}</tbody></table></div>
    <p class="muted" style="font-size:.8rem;margin:10px 0 0">A level teaspoon holds about 3–5 g of fine powder; a tablespoon holds far more. A kitchen gram scale, syringe or pipette is more exact. Mix medicated water fresh every day and make it the only water during an antibiotic course.</p></section>
  <section class="panel"><h3>Medicine list<span class="spacer"></span>${canWrite?`<button class="btn sm" type="button" data-add="meds">Add product</button>`:""}</h3>
    <div class="tw"><table><thead><tr><th>Product</th><th>Type</th><th>What it's for</th><th>Dosage / rate</th><th class="n">Withdrawal</th><th class="n">Cost (RWF)</th><th>Bought</th></tr></thead><tbody>${medRows||`<tr><td colspan="7" class="muted">No products yet.</td></tr>`}</tbody>
    <tfoot><tr class="tot"><td colspan="5">Total medicine cost</td><td class="n">${k(M.medCost)}</td><td></td></tr></tfoot></table></div></section>`;
}
function fmtAmt(v){return v>=10?v.toFixed(0):v>=1?v.toFixed(1).replace(/\.0$/,""):v.toFixed(2)}

function vFeed(M){
  if(!S.setup)return emptyState();
  const rows=[...S.feed].sort((a,b)=>(parse(a.date)??0)-(parse(b.date)??0));
  const byType={};rows.forEach(f=>{const t=(f.type||"Other").trim();const key=t[0].toUpperCase()+t.slice(1).toLowerCase();byType[key]=(byType[key]||0)+num(f.bags)*num(f.kgPerBag)});
  const mx=Math.max(1,...Object.values(byType));
  const perBird=M.alive?M.feedKg/M.alive:0;
  return `
  <div class="vhead"><div><h2>Feed</h2><p>Feed is usually 60–70% of what a cycle costs, so this is where buying well pays most.</p></div><span class="spacer"></span>${canWrite?`<button class="btn pri" type="button" data-add="feed">Add purchase</button>`:""}</div>
  <div class="hero">
    <div><div class="eyebrow">Feed bought</div><div class="big">${k(M.feedKg)}<small> kg</small></div><div class="sub">${rows.reduce((a,f)=>a+num(f.bags),0)} bags</div></div>
    <div><div class="eyebrow">Feed cost</div><div class="mid">${k(M.feedCost)}</div><div class="sub">RWF · ${M.totalCost?pct(M.feedCost/M.totalCost,0):"—"} of total cost</div></div>
    <div><div class="eyebrow">Average price</div><div class="mid">${M.feedKg?k(M.feedCost/M.feedKg):"—"}</div><div class="sub">RWF per kg</div></div>
    <div><div class="eyebrow">Per live bird</div><div class="mid">${perBird.toFixed(2)} kg</div><div class="sub">A 1.8–2 kg broiler usually eats about 3–4 kg by sale</div></div>
  </div>
  <div class="grid2">
  <section class="panel"><h3>Purchases</h3><div class="tw"><table><thead><tr><th>Date</th><th>Feed type</th><th class="n">Bags</th><th class="n">kg/bag</th><th class="n">Cost/bag</th><th class="n">Total (RWF)</th></tr></thead><tbody>
  ${rows.map(f=>`<tr class="${canWrite?"click":""}" data-edit="feed" data-id="${esc(f._id)}"><td class="mono">${fd(parse(f.date),1)}</td><td>${esc(f.type)}</td><td class="n">${num(f.bags)}</td><td class="n">${num(f.kgPerBag)}</td><td class="n">${k(num(f.costPerBag))}</td><td class="n">${k(num(f.bags)*num(f.costPerBag))}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">No purchases yet.</td></tr>`}
  </tbody><tfoot><tr class="tot"><td colspan="2">Total feed</td><td class="n">${rows.reduce((a,f)=>a+num(f.bags),0)}</td><td></td><td></td><td class="n">${k(M.feedCost)}</td></tr></tfoot></table></div></section>
  <section class="panel"><h3>Kilograms by stage</h3><div class="hbar">${Object.entries(byType).map(([t,v])=>`<span>${esc(t)}</span><span class="tr"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><span class="v">${k(v)} kg</span>`).join("")||'<span class="muted">No feed yet.</span>'}</div>
  <p class="muted" style="font-size:.82rem;margin:14px 0 0">Switch feed by stage: pre-starter and starter for the first weeks, then grower and finisher. Feed until full and keep feeders from running empty, especially in week 1.</p></section>
  </div>`;
}

const MAT_CATS=["Housing & heating","Feeding & water","Bedding & cleaning","Protective gear","Measuring & medicine tools","Other"];
function statusChip(st){const c={"Have it":"good","Running low":"warn","Need to buy":"crit","Broken or worn out":"crit"}[st]||"neutral";return `<span class="chip ${c}">${esc(st||"—")}</span>`}
function vMaterials(M){
  if(!S.setup)return emptyState();
  const byCat={};S.materials.forEach(m=>{const c=MAT_CATS.includes(m.category)?m.category:"Other";(byCat[c]=byCat[c]||[]).push(m)});
  const diff=Math.round(M.matCycle)-Math.round(M.coop);
  const sections=MAT_CATS.filter(c=>byCat[c]).map(c=>`<section class="panel"><h3>${esc(c)}<span class="spacer"></span><span class="muted" style="font-weight:400;font-size:.8rem">${k(byCat[c].reduce((a,m)=>a+M.matCost(m),0))} RWF</span></h3>
    <div class="tw"><table class="mat"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Cost (RWF)</th><th>Kind</th><th>Status</th><th>Bought</th><th>Notes</th></tr></thead><tbody>
    ${byCat[c].sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(m=>{const ph=photosFor("material",m._id);return `<tr class="${canWrite?"click":""}" data-edit="materials" data-id="${esc(m._id)}"><td><div style="display:flex;gap:8px;align-items:center">${ph.length?thumbs(ph.slice(0,1),1):(canWrite&&assets?`<button type="button" class="addph" style="width:40px;height:40px;font-size:.66rem" data-upload="material" data-key="${esc(m._id)}" title="Add a photo">+ photo</button>`:"")}<div><b>${esc(m.name)}</b>${m.where?`<div class="muted" style="font-size:.76rem">${esc(m.where)}</div>`:""}</div></div></td>
      <td class="n">${m.qty!=null?num(m.qty):"—"} ${esc(m.unit||"")}</td><td class="n">${num(m.unitCost)?k(M.matCost(m)):'<span class="muted">—</span>'}</td><td>${esc(m.kind||"")}${m.kind==="Reusable"&&num(m.cycles)>1?`<div class="muted" style="font-size:.76rem">${num(m.cycles)} cycles</div>`:""}</td><td>${statusChip(m.status)}</td><td class="mono">${fd(parse(m.dateBought))}</td><td class="note">${esc(m.notes||"")}</td></tr>`}).join("")}
    </tbody></table></div></section>`).join("");
  return `
  <div class="vhead"><div><h2>Materials</h2><p>Everything the flock room runs on: housing, heat, drinkers and feeders, bedding, protective gear and measuring tools. Reusable items are spread over the cycles they last, so each cycle carries a fair share of their cost.</p></div><span class="spacer"></span>${canWrite?`<button class="btn pri" type="button" data-add="materials">Add item</button>`:""}</div>
  <div class="hero">

function vMoney(M){
  if(!S.setup)return emptyState();
  const lastBag=[...S.feed].sort((a,b)=>(parse(b.date)??0)-(parse(a.date)??0))[0];
  const bagCost=lastBag?num(lastBag.costPerBag):0;
  if(!scen)scen={birds:M.onHand,weight:M.weight||1.8,price:M.price||4500,bags:0,extra:0};
  const sCost=M.totalCost+scen.bags*bagCost+scen.extra;
  const sRev=M.salesAmt+scen.birds*scen.weight*scen.price;
  const sProfit=sRev-sCost;
  const breakeven=scen.birds*scen.weight?sCost/(scen.birds*scen.weight):0;
  const lo=num(M.st.priceLow)||3200, hi=num(M.st.priceHigh)||5000;
  const prices=[lo,4000,4500,4800,hi].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
  const weights=[1.6,1.8,2.0,2.2];
  const sens=weights.map(w=>`<tr><th class="n">${w.toFixed(1)} kg</th>${prices.map(p=>{const v=M.salesAmt+scen.birds*w*p-sCost;return `<td class="n ${v<0?"neg":""} ${Math.abs(w-scen.weight)<1e-9&&p===scen.price?"cur":""}">${k(v)}</td>`}).join("")}</tr>`).join("");
  const sp=Math.max(0,M.profit);
  return `
  <div class="vhead"><div><h2>Money</h2><p>The cycle summary uses what you have entered so far. The planner below lets you test weights, prices and the feed still to buy before the sale.</p></div></div>
  <div class="grid2">
  <section class="panel"><h3>Cycle summary</h3><div class="kv">
    <div class="sec">Flock</div><div class="sec"></div>
    <div>Chicks paid for</div><div>${M.chicks}</div><div>Total chicks in flock (with ${M.bonus} free)</div><div>${M.flock}</div>
    <div>Total deaths</div><div>${M.deaths}</div><div>Birds alive (sellable)</div><div>${M.alive}</div><div>Death rate</div><div>${pct(M.mortality)}</div>
    <div class="sec">Costs</div><div class="sec"></div>
    <div>Chicks (${M.chicks} × ${k(num(M.st.pricePerChick))})</div><div>${k(M.chickCost)}</div><div>Feed</div><div>${k(M.feedCost)}</div><div>Medicine and vitamins</div><div>${k(M.medCost)}</div><div>Other costs</div><div>${k(M.other)}</div><div>Materials and equipment share</div><div>${k(M.coop)}</div><div>Expenses book</div><div>${k(M.expTotal)}</div>
    <div class="em">Total cost</div><div class="em">${rwf(M.totalCost)}</div>
    <div class="sec">Revenue</div><div class="sec"></div>
    <div>Sales recorded (${M.soldBirds} birds)</div><div>${k(M.salesAmt)}</div>${M.onHand?`<div>Expected for ${M.onHand} birds on hand</div><div>${M.onHand} × ${M.weight} × ${k(M.price)}</div>`:""}<div class="em">Total revenue</div><div class="em">${rwf(M.revenue)}</div>
    <div class="sec">Profit</div><div class="sec"></div>
    <div class="em">Total profit</div><div class="em" style="color:var(${M.profit<0?"--crit":"--ink"})">${rwf(M.profit)}</div>
    <div>Profit per bird</div><div>${M.alive?k(M.profit/M.alive):"—"}</div><div>Cost per kg live weight</div><div>${M.costPerKg?k(M.costPerKg):"—"}</div><div>Feed conversion (FCR)</div><div>${M.fcr!=null?M.fcr.toFixed(2):"—"}</div><div>Profit margin</div><div>${M.revenue?pct(M.profit/M.revenue):"—"}</div><div>Feed as share of cost</div><div>${M.totalCost?pct(M.feedCost/M.totalCost):"—"}</div>
  </div><p class="muted" style="font-size:.8rem;margin:12px 0 0">${num(M.st.actualWeight)?"Uses the actual sale weight from Setup.":"Uses the target weight until you enter the actual sale weight in Setup. Feed still to buy is not included here."}</p></section>
  <section class="panel"><h3>Sale planner</h3>
    <div class="fgrid">
      ${rng("sBirds",M.soldBirds?"Birds still to sell":"Birds sold",scen.birds,0,Math.max(1,M.onHand),1,v=>v)}
      ${rng("sWeight","Average weight per bird",scen.weight,1.2,2.6,0.05,v=>(+v).toFixed(2)+" kg")}
      ${rng("sPrice","Price per kg",scen.price,lo-400,hi+400,100,v=>k(v)+" RWF")}
      ${rng("sBags","Feed bags still to buy",scen.bags,0,12,1,v=>v+" bags")}

    </div>
    <div class="kv" style="margin-top:16px"><div>Revenue</div><div>${rwf(sRev)}</div><div>Cost</div><div>${rwf(sCost)}</div><div class="em">Profit</div><div class="em" style="color:var(${sProfit<0?"--crit":"--good"})">${rwf(sProfit)}</div><div>Margin</div><div>${sRev?pct(sProfit/sRev):"—"}</div><div>Break-even price</div><div>${k(breakeven)} RWF/kg</div></div>
    <h3 style="margin:18px 0 8px;font-size:.92rem">Profit at other weights and prices</h3>
    <div class="tw"><table class="sens"><thead><tr><th></th>${prices.map(p=>`<th class="n">${k(p)}/kg</th>`).join("")}</tr></thead><tbody>${sens}</tbody></table></div>
    <p class="muted" style="font-size:.78rem;margin:8px 0 0">RWF profit for ${scen.birds} birds with ${scen.bags} more bags of feed. The outlined cell is the current setting.</p>

    <div class="grid3" style="gap:12px">
      ${[["Back into the farm",0.5,"Chicks, feed and equipment for the next cycle"],["Trading capital",0.3,"Only money you can afford to lose"],["Savings",0.2,"Kept aside"]].map(([l,p,n])=>`<div><div class="eyebrow">${l} · ${p*100}%</div><div class="mid">${k(sp*p)}</div><div class="sub">${n}</div></div>`).join("")}
    </div>
    <p class="muted" style="font-size:.8rem;margin:12px 0 0">Based on the projected profit of ${rwf(M.profit)}. With a partner, agree in writing whether a 50/50 split is of profit or of sales, what counts as profit, and who pays for feed along the way. Investors get their money back first, then profit is split.</p></section>`;
}
function rng(id,label,val,min,max,step,f){return `<div class="field"><div class="rangehead"><label for="${id}">${label}</label><output id="${id}o">${f(val)}</output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}

function vYear(M){
  const cur=S.setup?{cycle:S.setup.cycleName||"Current",start:S.setup.startDate,chicks:M.chicks,deaths:M.deaths,mort:M.mortality,cost:M.totalCost,revenue:M.revenue,live:true}:null;
  const done=[...S.cycles].sort((a,b)=>num(a.cycle)-num(b.cycle));
  const rows=done.map(c=>({cycle:"Cycle "+num(c.cycle),start:c.start,chicks:num(c.chicks),deaths:num(c.deaths),mort:num(c.chicks)?num(c.deaths)/(num(c.chicks)+num(c.bonus)):0,cost:num(c.cost),revenue:num(c.revenue),_id:c._id}));
  const showCur=cur&&!done.some(c=>c.start===S.setup.startDate);
  const all=showCur?[...rows,cur]:rows;
  const tc=all.reduce((a,r)=>a+r.cost,0),tr=all.reduce((a,r)=>a+r.revenue,0);
  return `
  <div class="vhead"><div><h2>Year view</h2><p>A 45-day cycle plus about a week to clean leaves room for 6–7 cycles a year in the same space. Close each cycle when it is sold to keep its final numbers here.</p></div><span class="spacer"></span>${canWrite&&S.setup?`<button class="btn" type="button" data-act="closeCycle">Save current cycle's results</button>`:""}${canWrite?`<button class="btn pri" type="button" data-add="cycles">Add a cycle</button>`:""}</div>
  <section class="panel"><div class="tw"><table><thead><tr><th>Cycle</th><th>Start</th><th class="n">Chicks</th><th class="n">Deaths</th><th class="n">Death rate</th><th class="n">Cost (RWF)</th><th class="n">Revenue (RWF)</th><th class="n">Profit (RWF)</th></tr></thead><tbody>
  ${all.map(r=>`<tr class="${r.live||!canWrite?"":"click"}" ${r._id?`data-edit="cycles" data-id="${esc(r._id)}"`:""}><td><b>${esc(r.cycle)}</b> ${r.live?'<span class="chip info">in progress, projected</span>':""}</td><td class="mono">${fd(parse(r.start),1)}</td><td class="n">${r.chicks}</td><td class="n">${r.deaths}</td><td class="n">${pct(r.mort)}</td><td class="n">${k(r.cost)}</td><td class="n">${k(r.revenue)}</td><td class="n" style="color:var(${r.revenue-r.cost<0?"--crit":"--ink"})">${k(r.revenue-r.cost)}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">No cycles yet.</td></tr>`}
  </tbody><tfoot><tr class="tot"><td colspan="5">Total for the year</td><td class="n">${k(tc)}</td><td class="n">${k(tr)}</td><td class="n">${k(tr-tc)}</td></tr></tfoot></table></div></section>
  <section class="panel"><h3>What a year could look like</h3><p class="ink2" style="margin:0;max-width:70ch">At this cycle's projected profit of <b>${rwf(M.profit)}</b>, six cycles would give about <b>${rwf(M.profit*6)}</b> and seven about <b>${rwf(M.profit*7)}</b>. Growing to 200–300 birds is usually a better way to scale than squeezing the last few percent out of 100.</p></section>`;
}

function vGuide(){
  return `
  <div class="vhead"><div><h2>Care guide</h2><p>The key advice from your earlier conversations, kept in one place. It is general guidance, not a diagnosis. For serious or spreading problems, a vet or the RAB office should look at the birds.</p></div></div>
  <div class="grid2">
  <section class="panel"><h3>Death rate: what to expect</h3><div class="tw"><table><thead><tr><th>Death rate</th><th class="n">Birds of 102</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><span class="chip good">2%</span></td><td class="n">about 2</td><td>Your goal; possible with very good care</td></tr>
    <tr><td><span class="chip neutral">1–5%</span></td><td class="n">1–5</td><td>Normal range for a 45-day cycle</td></tr>
    <tr><td><span class="chip warn">5–10%</span></td><td class="n">5–10</td><td>What many beginners lose; profit starts to suffer</td></tr></tbody></table></div>
    <div class="prose"><p>About 80% of chick deaths happen in week 1. Deaths drop in weeks 2–3 and can rise a little in weeks 4–6 as fast growth strains the heart and lungs. Watch for a swollen belly, purple comb, hard breathing, or a chick that sits all the time.</p></div></section>
  <section class="panel"><h3>Heat and space</h3><div class="prose"><ul>
    <li>Week 1: 32–35 °C, then lower the heat about 2–3 °C each week. Keep the heater at night for a while, especially in rainy, cool weather.</li>
    <li>Chicks huddled tight under the heat are cold; chicks spread to the walls are too hot.</li>
    <li>Charcoal gives off fumes. Keep fresh air moving and do not stay in a closed room with burning charcoal.</li>
    <li>Space: about 5 m² in weeks 1–2, 7–9 m² in weeks 3–4, 9–14 m² near full size. A 3.5 × 4 m room works if you section it at first.</li></ul></div></section>
  <section class="panel"><h3>Bedding and ammonia</h3><div class="prose"><ul>
    <li>A strong sharp smell is ammonia from wet droppings and soggy shavings. It burns eyes, nose and lungs, so chicks sneeze and wheeze, and it helps coccidiosis spread.</li>
    <li>Remove wet and clumped shavings daily and add fresh pine or similar shavings 5–10 cm deep. Avoid cedar.</li>
    <li>Raise drinkers on a board, stir the shavings every day or two, and open windows on opposite sides during the day.</li>
    <li>Squeeze test: a handful should fall apart, not clump. Walk-in test: step outside for a few minutes, then walk in. The first smell is what the chicks breathe all day.</li></ul></div></section>
  <section class="panel"><h3>Medicine rules</h3><div class="prose"><ul>
    <li>No meat sale until the withdrawal days have passed after the last dose.</li>
    <li>Enrosol-S: pause calcium, Multisol, Liver-Extra and Broiler Booster during the course; minerals can stop it from working. Do not combine it with chloramphenicol, tetracyclines, erythromycin or lincomycin.</li>
    <li>Do not give two antibiotics at the same time without asking a vet.</li>
    <li>Antibiotics only help bacterial infections, not viruses (IB, Newcastle) and not mites. Water does not fix wheezing.</li>
    <li>Vaccinate only once the chicks have stopped sneezing and the room is dry.</li></ul></div></section>
  <section class="panel"><h3>Protective gear</h3><div class="prose"><ul>
    <li>Old clothes kept only for the room, and rubber boots.</li>
    <li>A surgical mask for daily work; N95 or KN95 for deep cleaning.</li>
    <li>Disposable nitrile gloves when handling sick or dead birds or cleaning. Wash with soap every time.</li>
    <li>Shuffle your boots and look down so you do not step on chicks.</li></ul></div></section>
  <section class="panel"><h3>Daily routine around school</h3><div class="timeline">
    <div class="d">6:30</div><div>Wake up; morning check (30–45 min)</div>
    <div class="d">8:30–15:30</div><div>School; the maid covers water, feed and bedding</div>
    <div class="d">16:00–18:00</div><div>Main session in the room</div>
    <div class="d">18:45–20:45</div><div>Homework</div>
    <div class="d">20:45–21:45</div><div>Evening check</div>
    <div class="d">23:00</div><div>Sleep. A tired person misses problems with the chicks.</div></div></section>
  </div>
  <section class="panel"><h3>What happened this cycle</h3><div class="timeline">
    <div class="d">21 Sep</div><div><b>Chicks arrived</b> (102). Count by moving small batches into a box; quiet chicks around the heat are usually content.</div>
    <div class="d">22 Sep</div><div><b>One chick isolating itself.</b> Check eyes, feathers, vent, legs and breathing; set it near food and water and watch.</div>
    <div class="d">Late Sep</div><div><b>Diarrhea.</b> Likely coccidiosis or a gut infection; treated with sulfadimidine.</div>
    <div class="d">Early Oct</div><div><b>Sneezing after rain; heater removed at about 2 weeks.</b> Wet bedding and ammonia likely. Dry shavings, cross-ventilation, heater back at night.</div>
    <div class="d">9 Oct</div><div><b>A chick with bare pink skin and drooping eyes.</b> Warm dry box, water with vitamins, check for mites, see an agrovet or vet.</div>
    <div class="d">18 Oct</div><div><b>A chick died with fluid in its belly.</b> Possible ascites or a bacterial infection; a vet can open a dead bird to find the cause.</div>
    <div class="d">About 20 Oct</div><div><b>Wheezing.</b> Check ammonia, bedding, charcoal fumes and drafts. Could be IB, CRD or E. coli; a vet can tell.</div>
    <div class="d">22 Oct</div><div><b>Swollen vent on some energetic chicks.</b> Do not squeeze or drain. Could be pecking, stuck droppings, mites, prolapse or a bruise. Get a close-up photo looked at.</div></div></section>`;
}

function vPhotos(M){
  if(!S.setup)return emptyState();
  const dayPh=S.photos.filter(p=>p.kind==="day").sort((a,b)=>num(a.day)-num(b.day)||String(a.createdAt).localeCompare(String(b.createdAt)));
  const first=dayPh[0], last=dayPh.length?dayPh.filter(p=>num(p.day)===num(dayPh[dayPh.length-1].day)).slice(-1)[0]:null;
  const withPh=[...new Set(dayPh.map(p=>num(p.day)))].sort((x,y)=>x-y);
  let tiles="";
  if(showAllDays){for(const d of M.days){
    const ph=photosFor("day",d.day);const fut=M.dayNow!=null&&d.day>M.dayNow;
    const cls=`tile ${ph.length?"has":""} ${fut?"fut":""} ${d.day===M.dayNow?"today":""}`;
    tiles+=ph.length?`<button type="button" class="${cls}" data-dayph="${d.day}" aria-label="Day ${d.day} photos"><img src="${blob(ph[ph.length-1].assetId)}" alt="" loading="lazy"><span class="cap"><span>Day ${d.day}</span><span>${ph.length>1?ph.length+" photos":fd(d.date)}</span></span></button>`
      :`<button type="button" class="${cls}" ${fut?"disabled":`data-dayph="${d.day}"`}><b>Day ${d.day}</b><span class="plus">${fd(d.date)}</span>${!fut&&canWrite&&assets?'<span class="plus">+ add</span>':""}</button>`;
  }}
  const list=withPh.map(n=>{const d=M.days[n-1];const ph=photosFor("day",n);return `<div class="pday"><div class="when"><b>Day ${n}</b><span>${fd(d.date,1)} · ${d.endAlive} birds</span>${canWrite?`<div><button type="button" class="btn ghost sm" style="padding-left:0" data-dayph="${n}">Captions, move or delete</button></div>`:""}</div><div class="thumbs">${thumbs(ph)}</div></div>`}).join("");
  const medRows=S.meds.map(m=>{const ph=photosFor("med",m._id);return `<div class="medph"><div><b>${esc(m.name)}</b><div class="muted" style="font-size:.8rem">${esc(m.type||"")}${num(m.withdrawal)?` · ${num(m.withdrawal)}-day wait`:""}</div><div class="muted" style="font-size:.78rem;margin-top:4px">Photograph the front, the dose table and the withdrawal line on the label.</div></div><div class="thumbs">${thumbs(ph)}${addBtn("med",m._id)}${!ph.length&&!(canWrite&&assets)?'<span class="muted">No photos yet.</span>':""}</div></div>`}).join("");
  const other=photosFor("other");
  return `
  <div class="vhead"><div><h2>Photos</h2><p>Pictures from across the cycle show how the broilers grow from chick to sale. Medicine photos keep the label doses and withdrawal days on hand.</p></div></div>
  ${!assets?`<div class="empty">Photo uploads are not available in this view. Open the page in Claude, signed in as its owner or an editor, to add photos.</div>`:""}
  ${first&&last&&num(first.day)!==num(last.day)?`<section class="panel"><h3>How they have grown</h3><div class="compare">
    <figure><img src="${blob(first.assetId)}" alt="Day ${first.day}" data-view="${esc(first._id)}"><figcaption><b>Day ${first.day}</b> · ${fd(parse(first.date),1)}</figcaption></figure>
    <figure><img src="${blob(last.assetId)}" alt="Day ${last.day}" data-view="${esc(last._id)}"><figcaption><b>Day ${last.day}</b> · ${fd(parse(last.date),1)} · ${num(last.day)-num(first.day)} days later</figcaption></figure></div></section>`:""}

/* ---------- growth, FCR ---------- */
const ROSS=[[0,44],[7,213],[14,533],[21,1012],[28,1616],[35,2296],[42,2998],[45,3295]];
function targetAt(day,M){const tgt=num(M.st.targetWeight)||2;const end=M.cycleDays;const r=d=>{d=Math.max(0,Math.min(45,d));for(let i=1;i<ROSS.length;i++){if(d<=ROSS[i][0]){const [a,av]=ROSS[i-1],[b,bv]=ROSS[i];return av+(bv-av)*(d-a)/(b-a)}}return ROSS[ROSS.length-1][1]};
  const scale=(tgt*1000)/r(Math.min(45,end));return r(day*Math.min(45,end)/end)*scale/1000}
function growthChart(M){
  const W=640,H=250,L=44,R=16,T=14,B=30;const maxW=Math.max(num(M.st.targetWeight)||2,...M.weighins.map(w=>w.avg))*1.08;
  const x=d=>L+d/M.cycleDays*(W-L-R), y=v=>T+(1-v/maxW)*(H-T-B);
  let tp="";for(let d=0;d<=M.cycleDays;d++)tp+=(d?"L":"M")+x(d).toFixed(1)+","+y(targetAt(d,M)).toFixed(1);
  let gp="";M.weighins.forEach((w,i)=>{gp+=(i?"L":"M")+x(w.day).toFixed(1)+","+y(w.avg).toFixed(1)});
  let yt="";const st=maxW>2.4?0.5:0.25;for(let v=0;v<=maxW;v+=st)yt+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v.toFixed(v%1?2:0)}</text>`;
  let xt="";[0,7,14,21,28,35,42].filter(d=>d<=M.cycleDays).concat([M.cycleDays]).forEach(d=>xt+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle">${d}</text>`);
  const dots=M.weighins.map(w=>{const t=targetAt(w.day,M);return `<circle class="gdot" cx="${x(w.day)}" cy="${y(w.avg)}" r="5"/><rect class="hit" x="${x(w.day)-10}" y="${T}" width="20" height="${H-T-B}" data-tip="${esc(`<b>Day ${w.day}</b> · ${fd(parse(w.date),1)}<br>${w.avg.toFixed(2)} kg average (${w.birds} birds weighed)<br>Target path: ${t.toFixed(2)} kg · ${w.avg>=t?"on or above":"below by "+(t-w.avg).toFixed(2)+" kg"}${w.fcr?`<br>FCR ${w.fcr.toFixed(2)}`:""}`)}"/>`}).join("");
  const today=M.dayNow>=0&&M.dayNow<=M.cycleDays?`<line class="todayln" x1="${x(M.dayNow)}" x2="${x(M.dayNow)}" y1="${T}" y2="${H-B}" stroke-opacity=".5"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average weight against the target path">${yt}<path class="proj" d="${tp}"/>${today}<path class="series" d="${gp}"/>${dots}${xt}<text x="${L}" y="${H}" class="lab" style="font-size:10px">day of cycle · kg per bird</text></svg>
  <div class="legend"><span><i style="background:var(--ink);height:2px"></i>Your weigh-ins</span><span><i style="border-top:2px dashed var(--muted);height:0"></i>Target path to ${num(M.st.targetWeight)||2} kg</span><span><i style="background:var(--accent);width:2px;height:12px"></i>Today</span></div>`;
}
function vGrowth(M){
  if(!S.setup)return emptyState();

  <p class="muted" style="font-size:.78rem;margin:10px 0 0">FCR = feed used ÷ (live weight now + weight already sold − chick weight at arrival). Feed used = feed bought up to that day − feed left in store. Chicks are counted at about 44 g each on arrival.</p></section>`;

function openForm(col,rec){

  $("#dlgBody").innerHTML=`<div class="fgrid">${F.fields.map(([k2,l,t,o])=>{
    const v=rec[k2]??(k2==="timesPerDay"?1:k2==="kgPerBag"?50:k2==="date"&&col!=="todos"?iso(todayMs()):k2==="pricePerKg"&&S.setup?num(S.setup.salePrice)||"":"");
    let inp;
    if(t==="select")inp=`<select id="f_${k2}">${o.map(x=>`<option ${String(v).toLowerCase()===x.toLowerCase()?"selected":""}>${x}</option>`).join("")}</select>`;
    else if(t==="buyer")inp=`<input type="text" id="f_${k2}" list="buyerList" value="${esc(v)}" placeholder="Pick or type a name"><datalist id="buyerList">${[...new Set(S.buyers.map(b=>b.name).concat(S.sales.map(x=>x.buyer)).filter(Boolean))].map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>`;
    else if(t==="product")inp=`<select id="f_${k2}">${S.meds.map(m=>`<option ${m.name===v?"selected":""}>${esc(m.name)}</option>`).join("")}${v&&!S.meds.some(m=>m.name===v)?`<option selected>${esc(v)}</option>`:""}</select>`;
    else if(t==="checkbox")inp=`<label class="check" style="border:0"><input type="checkbox" id="f_${k2}" ${v?"checked":""}><span>${l}</span></label>`;
    else inp=`<input type="${t}" id="f_${k2}" value="${esc(v)}" ${t==="number"?'step="any"':""}>`;
    const wide=["notes","purpose","dosage","avoidWith","where"].includes(k2)||(k2==="text"&&col==="todos");
    return t==="checkbox"?`<div class="field">${inp}</div>`:`<div class="field ${wide?"wide":""}"><label for="f_${k2}">${l}</label>${inp}${typeof o==="string"?`<span class="hint">${o}</span>`:""}</div>`;
  }).join("")}</div><p id="fErr" class="dz" hidden></p>`;
  $("#dlgFoot").innerHTML=`${rec._id?`<button class="btn danger" type="button" id="fDel">Delete</button>`:""}<span class="spacer" style="flex:1"></span><button class="btn" type="button" id="fCancel">Cancel</button><button class="btn pri" type="button" id="fSave">Save</button>`;
  const dlg=$("#dlg");dlg.showModal();
  $("#fCancel").onclick=()=>dlg.close();
  $("#fSave").onclick=async()=>{
    const out={};F.fields.forEach(([k2,,t])=>{const el=$("#f_"+k2);if(t==="checkbox")out[k2]=el.checked;else if(t==="number")out[k2]=el.value===""?null:Number(el.value);else out[k2]=el.value.trim()});
    const req={expenses:"amount",sales:"birds",buyers:"name",weighins:"totalKg",vaccines:"disease",materials:"name",feed:"date",meds:"name",doses:"start",todos:"text",cycles:"cycle"}[col];
    if(out[req]===""||out[req]==null){const e=$("#fErr");e.textContent="Fill in "+F.fields.find(f=>f[0]===req)[1].toLowerCase()+" first.";e.hidden=false;return}
    try{const ref=rec._id?db.collection(col).doc(rec._id):db.collection(col).doc();await ref.set(out);dlg.close();toast("Saved")}catch(e){writeFail(e)}
  };
  if(rec._id)$("#fDel").onclick=()=>{
    const b=$("#fDel");if(b.dataset.armed){db.collection(col).doc(rec._id).delete().then(()=>{dlg.close();toast("Deleted")}).catch(writeFail)}else{b.dataset.armed="1";b.textContent="Tap again to delete"}
  };
}
function writeFail(e){
  if(e&&e.code==="invalid_argument"&&writeUnknown){canWrite=false;writeUnknown=false;schedule();toast("You can view this ledger but not change it.");return}
  toast(e&&e.code==="quota_exceeded"?"The ledger is full. Delete old records to add more.":"Could not save. Check your connection and try again.");
}
const CAUSES=["","Unknown","Crushed or stepped on","Weak or not eating","Swollen belly (ascites)","Cold or piled up","Diarrhea","Breathing problems","Other"];
const LITTER=["","Dry","Damp","Wet"], SMELL=["","None","Slight","Strong"];
function condFields(r,pre){const sel=(id,l,opts,v)=>`<div class="field"><label for="${pre}${id}">${l}</label><select id="${pre}${id}">${opts.map(o=>`<option value="${o}" ${String(v||"")===o?"selected":""}>${o||"—"}</option>`).join("")}</select></div>`;
  return `${sel("cause","Cause of death",CAUSES,r.cause)}<div class="field"><label for="${pre}temp">Room temperature (°C)</label><input type="number" id="${pre}temp" step="0.5" value="${esc(r.temp??"")}"></div>${sel("litter","Litter",LITTER,r.litter)}${sel("smell","Ammonia smell",SMELL,r.smell)}`}
function readCond(pre){const t=$("#"+pre+"temp").value;return {cause:$("#"+pre+"cause").value,temp:t===""?null:Number(t),litter:$("#"+pre+"litter").value,smell:$("#"+pre+"smell").value}}
function condLine(r){if(!r)return"";const b=[];if(r.cause&&num(r.deaths))b.push(`<span class="chip crit">${esc(r.cause)}</span>`);if(r.temp!=null&&r.temp!=="")b.push(`<span class="chip neutral">${esc(r.temp)} °C</span>`);if(r.litter)b.push(`<span class="chip ${r.litter==="Dry"?"good":r.litter==="Damp"?"warn":"crit"}">Litter ${esc(r.litter.toLowerCase())}</span>`);if(r.smell)b.push(`<span class="chip ${r.smell==="None"?"good":r.smell==="Slight"?"warn":"crit"}">Smell ${esc(r.smell.toLowerCase())}</span>`);return b.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px">${b.join("")}</div>`:""}
function editDaily(day){

    if(pv.dataset.upload){pending=pv.dataset.upload==="day"?{kind:"day",day:+pv.dataset.key||0}:pv.dataset.upload==="med"?{kind:"med",medId:pv.dataset.key}:pv.dataset.upload==="material"?{kind:"material",materialId:pv.dataset.key}:{kind:"other"};$("#filePick").value="";$("#filePick").click();return}

  if(gb&&db){const m=S.materials.find(x=>x._id===gb.dataset.gotit);if(m){const o={...m};delete o._id;o.status="Have it";if(!o.dateBought)o.dateBought=iso(todayMs());try{await db.collection("materials").doc(m._id).set(o);toast(m.name+" marked as bought")}catch(err){writeFail(err)}}return}
  const t=e.target.closest("[data-tab],[data-go],[data-add],[data-edit],[data-day],[data-act],[data-step]");if(!t)return;
  if(t.dataset.tab||t.dataset.go){tab=t.dataset.tab||t.dataset.go;try{history.replaceState(null,"","#"+tab)}catch(_){}render();window.scrollTo({top:0});return}

    try{for(const p of w)await p;toast("Common plan loaded. Check it with the RAB office or a vet.")}catch(err){writeFail(err)}return}
  if(act==="moveOther"){const M=derive();try{await db.collection("expenses").doc().set({date:S.setup.startDate,category:"Other",text:"Other costs moved from Setup",amount:M.other,paidTo:"",notes:"Was entered in Setup as other costs"});const o={...S.setup};delete o._id;o.otherCosts=0;await db.doc("farm/setup").set(o);toast("Moved to the expenses book")}catch(err){writeFail(err)}return}

  if(act==="toggleDays"){showAllDays=!showAllDays;render();return}
  if(act==="saveToday"){const M=derive();const d=M.dayNow;try{await db.collection("daily").doc(dayId(d)).set({day:d,deaths:num($("#qDeaths").textContent),notes:$("#qNotes").value.trim(),...readCond("q_")});toast("Day "+d+" saved")}catch(err){writeFail(err)}}
  if(act==="saveSetup"){const out={...(S.setup||{})};delete out._id;["cycleName","startDate","notes"].forEach(k2=>out[k2]=($("#su_"+k2)?.value||"").trim());["cycleDays","chicks","bonusChicks","pricePerChick","targetWeight","actualWeight","salePrice","priceLow","priceHigh","otherCosts","coopShare"].forEach(k2=>{const v=$("#su_"+k2).value;out[k2]=v===""?null:Number(v)});
    if(!parse(out.startDate)){toast("Enter a start date first.");return}
    try{await db.doc("farm/setup").set(out);scen=null;toast("Setup saved")}catch(err){writeFail(err)}}
  if(act==="closeCycle"){const M=derive();const n=(S.cycles.reduce((a,c)=>Math.max(a,num(c.cycle)),0)||0)+1;const exist=S.cycles.find(c=>c.start===S.setup.startDate);
    const data={cycle:exist?num(exist.cycle):n,start:S.setup.startDate,chicks:M.chicks,bonus:M.bonus,deaths:M.deaths,cost:M.totalCost,revenue:M.revenue,notes:(num(M.st.actualWeight)?"Final":"Projected")+" at "+M.weight+" kg × "+M.price+" RWF/kg"};
    try{await db.collection("cycles").doc(exist?exist._id:"cycle-"+n).set(data);toast("Cycle results saved")}catch(err){writeFail(err)}}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="filePick"&&pending&&t.files.length){const tg=pending;pending=null;await uploadFiles([...t.files],tg);return}
  if(t.dataset.moveph&&db){const p=S.photos.find(x=>x._id===t.dataset.moveph);const M=derive();const n=Math.round(num(t.value));if(p&&n>=1&&n<=M.cycleDays&&n!==num(p.day)){const o={...p};delete o._id;o.day=n;o.date=iso(M.start+(n-1)*DAY);try{await db.collection("photos").doc(p._id).set(o);toast("Moved to day "+n)}catch(err){writeFail(err)}}return}
  if(t.dataset.cap&&db){const p=S.photos.find(x=>x._id===t.dataset.cap);if(p){const o={...p};delete o._id;o.caption=t.value.trim();try{await db.collection("photos").doc(p._id).set(o)}catch(err){writeFail(err)}}return}
  if(t.dataset.check&&db){const d=iso(todayMs());const items={...(S.checks[d]?.items||{})};items[t.dataset.check]=t.checked;try{await db.collection("checks").doc(d).set({date:d,items})}catch(err){writeFail(err)}}
  if(t.dataset.todo&&db){const r=S.todos.find(x=>x._id===t.dataset.todo);if(r){const o={...r};delete o._id;o.done=t.checked;try{await db.collection("todos").doc(r._id).set(o)}catch(err){writeFail(err)}}}
  if(t.id==="donly"){dailyFilter.deathsOnly=t.checked;render()}
  if(t.id==="cStage"){calc.stage=t.value;render()}
  if(t.id==="sExtra"&&scen){scen.extra=Math.max(0,num(t.value));render()}
  const map2={sBirds:"birds",sWeight:"weight",sPrice:"price",sBags:"bags"};
  if(map2[t.id]&&scen){scen[map2[t.id]]=Number(t.value);render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="dq"){dailyFilter.q=t.value;render()}
  if(t.id==="cL"){const v=num(t.value);if(v>0){calc.litres=v;render()}}
  const map={sBirds:"birds",sWeight:"weight",sPrice:"price",sBags:"bags"};

});

async function downloadReport(){
  const el=document.getElementById("reportDoc");if(!el)return;
  if(!downloads){toast("Downloads are not available here.");return}
  const c=el.cloneNode(true);c.querySelectorAll("rect.hit").forEach(r=>r.remove());
  for(const img of c.querySelectorAll("img")){try{const r=await fetch(img.getAttribute("src"));const b=await r.blob();img.src=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){img.remove()}}
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const name=(S.setup?.farmName||"flock")+" "+(S.setup?.cycleName||"cycle")+" report";
  const html=`<!doctype html><html lang="fr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)}</title><style>${css}body{padding:24px}.report{max-width:960px;margin:0 auto}</style></head><body>${c.outerHTML}</body></html>`;
  try{await downloads.save({filename:name.replace(/[^\w-]+/g,"_")+".html",data:html})}catch(err){if(!err||err.code!=="declined")toast("The report could not be downloaded.")}
}
/* ---------- export ---------- */
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
$("#exportBtn").addEventListener("click",async()=>{
  const b=$("#exportBtn");b.disabled=true;b.textContent="Preparing…";
  try{
    const X=await loadXLSX();const M=derive();const wb=X.utils.book_new();
    const _t=window.__frTr||(x=>x);const add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows.map(r=>r.map(c=>typeof c==="string"?_t(c):c))),_t(name).replace(/[\\/?*:\[\]]/g,"-").slice(0,31));
    const st=M.st;
    add("Setup",[["Item","Value"],["Cycle name",st.cycleName],["Start date",st.startDate],["Chicks bought",M.chicks],["Price per chick (RWF)",num(st.pricePerChick)],["Target sale weight (kg)",num(st.targetWeight)],["Expected sale price (RWF/kg)",M.price],["Other costs (RWF)",M.other],["Coop/equipment share (RWF)",M.coop],["Actual avg weight at sale (kg)",st.actualWeight??""],["Bonus chicks",M.bonus],["Total chicks in flock",M.flock]]);
    add("Daily Log",[["Date","Day #","Birds alive (start)","Deaths","Birds alive (end)","Notes"],...M.days.map(d=>[iso(d.date),d.day,d.startAlive,d.deaths,d.endAlive,d.rec?.notes||""]),["TOTALS","","",M.deaths,M.alive,""]]);
    add("Feed Purchases",[["Date","Feed type","Bags","kg per bag","Cost per bag (RWF)","Total (RWF)"],...S.feed.map(f=>[f.date,f.type,num(f.bags),num(f.kgPerBag),num(f.costPerBag),num(f.bags)*num(f.costPerBag)]),["TOTAL","","","","",M.feedCost]]);
    add("Medicine Log",[["Product","Type","What it's for","Cost (RWF)","Dosage / rate","Withdrawal (days)","Date bought","Do not combine with","Notes"],...S.meds.map(m=>[m.name,m.type,m.purpose,num(m.cost),m.dosage,num(m.withdrawal),m.dateBought,m.avoidWith||"",m.notes||""]),["TOTAL","","",M.medCost]]);
    add("Dosing Log",[["First day","Last day","Product","Times per day","Days given","Total doses","Wait (days)","Safe to sell after","Notes"],...M.doses.map(d=>[d.start,d.end||"still giving",d.product,num(d.timesPerDay)||1,d.daysGiven??"",d.total??"",d.wd??"",d.safe!=null?iso(d.safe):"no wait",d.notes||""]),["Latest safe-to-sell date","","","","","","",M.latestSafe!=null?iso(M.latestSafe):"none"]]);
    add("Cycle Summary",[["Item","Value"],["Chicks paid for",M.chicks],["Total chicks in flock",M.flock],["Total deaths",M.deaths],["Birds alive",M.alive],["Mortality rate",+(M.mortality*100).toFixed(2)+"%"],["Chicks cost",M.chickCost],["Feed cost",M.feedCost],["Medicine cost",M.medCost],["Other costs",M.other],["Coop/equipment",M.coop],["TOTAL COST",M.totalCost],["Sale weight (kg)",M.weight],["Price per kg",M.price],["TOTAL REVENUE",M.revenue],["TOTAL PROFIT",M.profit]]);
    add("Materials",[["Item","Category","Kind","Qty","Unit","Cost per unit (RWF)","Total (RWF)","Cycles it lasts","Status","Date bought","Kept","Notes"],...S.materials.map(m=>[m.name,m.category,m.kind,m.qty??"",m.unit||"",m.unitCost??"",M.matCost(m),m.cycles??"",m.status||"",m.dateBought||"",m.where||"",m.notes||""])]);
    add("Expenses",[["Date","Category","What for","Paid to","Amount (RWF)","Notes"],...S.expenses.map(e=>[e.date,e.category,e.text||"",e.paidTo||"",num(e.amount),e.notes||""]),["TOTAL","","","",M.expTotal,""]]);
    add("Sales",[["Date","Buyer","Birds","Live kg","Price per kg","Amount (RWF)","Paid (RWF)","Notes"],...S.sales.map(x=>[x.date,x.buyer||"",num(x.birds),num(x.kg),num(x.pricePerKg),saleAmt(x),num(x.paid),x.notes||""]),["TOTAL","",M.soldBirds,M.soldKg,"",M.salesAmt,M.salesPaid,""]]);
    add("Buyers",[["Name","Phone","Place","Notes"],...S.buyers.map(b=>[b.name,b.phone||"",b.place||"",b.notes||""])]);
    add("Weigh-ins",[["Date","Day","Birds weighed","Total kg","Average kg","Feed left (kg)","FCR"],...M.weighins.map(w=>[w.date,w.day,num(w.birds),num(w.totalKg),+w.avg.toFixed(3),w.feedLeftKg??"",w.fcr?+w.fcr.toFixed(2):""])]);
    add("Vaccinations",[["Day","Disease","Vaccine","How","Status","Date given","Notes"],...M.vax.map(v=>[num(v.day),v.disease,v.vaccine||"",v.route||"",v.status||"",v.dateGiven||"",v.notes||""])]);
    add("Reminders",[["Target date","Reminder","Done","Notes"],...S.todos.map(t=>[t.date||"",t.text,t.done?"yes":"no",t.notes||""])]);
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    await downloads.save({filename:(st.cycleName||"cycle").replace(/[^\w-]+/g,"_")+"_registre_PouletPro.xlsx",data:buf});
  }catch(err){if(!err||err.code!=="declined")toast(err&&err.code?"The download is not available here.":"Could not build the Excel file.")}
  b.disabled=false;b.textContent="Export to Excel";
});

(async()=>{
  const claude=window.__pp||window.claude;

  const [dbx,user,dlx,asx]=await Promise.all([claude.use("db"),claude.use("user").catch(()=>null),claude.use("downloads").catch(()=>null),claude.use("assets").catch(()=>null)]);

  db.doc("farm/setup").onSnapshot(s=>{S.setup=s.exists?{...s.data()}:null;mark("setup")},onErr);

  db.collection("checks").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data()});S.checks=o;mark("checks")},onErr);
})();
})();
